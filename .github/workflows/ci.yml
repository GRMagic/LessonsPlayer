# Build e testes a cada push e pull request; a cada push na main que passar nos testes, um release com o zip.
#
# O runner não tem placa de som nem GPU, e os testes que baixam modelos do Whisper (centenas de MB) e transcrevem
# na CPU levariam muito tempo. Eles ficam de fora pelas marcas Requires=WhisperModel e Requires=AudioDevice, e são
# rodados localmente (ver README, Desenvolvimento).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build e testes
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (warnings como erros)
        run: dotnet build --configuration Release

      - name: Testes de unidade (Core)
        run: dotnet test --project tests/LessonsPlayer.Core.Tests --configuration Release --no-build

      - name: Testes de unidade (Presentation)
        run: dotnet test --project tests/LessonsPlayer.Presentation.Tests --configuration Release --no-build

      - name: Testes de integração (sem modelo do Whisper nem placa de som)
        run: >-
          dotnet test --project tests/LessonsPlayer.Integration.Tests --configuration Release --no-build
          -- --filter-not-trait "Requires=WhisperModel" --filter-not-trait "Requires=AudioDevice"

  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: ./scripts/publish.ps1 -Version $env:VERSION

      - name: Release no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "artifacts/publish/LessonsPlayer-$env:VERSION-win-x64.zip"
          Move-Item artifacts/publish/LessonsPlayer-win-x64.zip $zip
          gh release create "v$env:VERSION" $zip `
            --target $env:GITHUB_SHA `
            --title "LessonsPlayer $env:VERSION" `
            --notes "Build automático do commit $env:GITHUB_SHA. Descompacte e abra LessonsPlayer.exe (Windows 10/11 x64; não precisa instalar o .NET)."
